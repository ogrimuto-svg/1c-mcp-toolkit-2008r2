name: build-2008r2
on: [workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        arch: [x64, Win32]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 2008R2 patch
        run: curl -L -o 2008r2.patch https://github.com/user-attachments/files/33750020/mcp_http_transport_2008r2_fix.txt
        working-directory: native_components/MCPHttpTransport
      - name: Apply patch
        run: git apply 2008r2.patch
        working-directory: native_components/MCPHttpTransport
      - name: Redirect Win8-only API to Win7 equivalent
        shell: pwsh
        working-directory: native_components/MCPHttpTransport
        run: |
          if ("${{ matrix.arch }}" -eq "Win32") {
            $alt = "/alternatename:_GetSystemTimePreciseAsFileTime@4=_GetSystemTimeAsFileTime@4"
          } else {
            $alt = "/alternatename:GetSystemTimePreciseAsFileTime=GetSystemTimeAsFileTime"
          }
          Write-Host "Using: $alt"
          Add-Content CMakeLists.txt "`ntarget_link_options(MCPHttpTransport PRIVATE `"$alt`")"
      - name: Configure (static CRT)
        run: cmake -B build -A ${{ matrix.arch }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        working-directory: native_components/MCPHttpTransport
      - name: Build
        run: cmake --build build --config Release
        working-directory: native_components/MCPHttpTransport
      - name: Preflight - no Win8+ imports
        shell: pwsh
        working-directory: native_components/MCPHttpTransport
        run: |
          $dll = "build\Release\MCPHttpTransport.dll"
          foreach ($sym in 'GetSystemTimePreciseAsFileTime','CreateFile2','CreateFileMappingFromApp','MapViewOfFileFromApp','GetNativeSystemInfo') {
            $hit = Select-String -Path $dll -Pattern $sym -SimpleMatch -Quiet
            if ($hit) { Write-Warning "$sym still referenced in import table!" } else { Write-Host "$sym OK" }
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCPHttpTransport-${{ matrix.arch }}-2008r2
          path: native_components/MCPHttpTransport/build/Release/MCPHttpTransport.dll
