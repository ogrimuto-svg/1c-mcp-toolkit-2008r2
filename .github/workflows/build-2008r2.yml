name: build-2008r2
on: [workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        arch: [x64, Win32]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 2008R2 patch
        run: curl -L -o 2008r2.patch https://github.com/user-attachments/files/33750020/mcp_http_transport_2008r2_fix.txt
        working-directory: native_components/MCPHttpTransport
      - name: Apply patch
        run: git apply 2008r2.patch
        working-directory: native_components/MCPHttpTransport
      - name: Add Win7/2008R2 stubs
        shell: pwsh
        working-directory: native_components/MCPHttpTransport
        run: |
          @'
          // stubs.cpp - совместимость статического CRT VS2022 с Windows 7 / Server 2008 R2
          #include <windows.h>
          extern "C" {
          VOID WINAPI RtlUnwindEx(PVOID a, PVOID b, PVOID c, PVOID d, PVOID e, PVOID f)
          {
              typedef VOID (WINAPI *Fn)(PVOID, PVOID, PVOID, PVOID, PVOID, PVOID);
              HMODULE m = GetModuleHandleW(L"ntdll.dll");
              if (m) { Fn fn = (Fn)GetProcAddress(m, "RtlUnwindEx"); if (fn) { fn(a,b,c,d,e,f); return; } }
              TerminateProcess(GetCurrentProcess(), 127);
          }
          VOID WINAPI GetSystemTimePreciseAsFileTime(LPFILETIME ft)
          {
              GetSystemTimeAsFileTime(ft);
          }
          }
          '@ | Out-File -Encoding ascii stubs.cpp
          Add-Content CMakeLists.txt "`ntarget_sources(MCPHttpTransport PRIVATE `${CMAKE_CURRENT_SOURCE_DIR}/stubs.cpp)"
      - name: Configure (static CRT)
        run: cmake -B build -A ${{ matrix.arch }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        working-directory: native_components/MCPHttpTransport
      - name: Build
        run: cmake --build build --config Release
        working-directory: native_components/MCPHttpTransport
      - name: Preflight - no Win8+ imports
        shell: pwsh
        working-directory: native_components/MCPHttpTransport
        run: |
          $dll = "build\Release\MCPHttpTransport.dll"
          foreach ($sym in 'GetSystemTimePreciseAsFileTime','CreateFile2','CreateFileMappingFromApp','MapViewOfFileFromApp','GetNativeSystemInfo') {
            $hit = Select-String -Path $dll -Pattern $sym -SimpleMatch -Quiet
            if ($hit) { Write-Warning "$sym still referenced in import table!" } else { Write-Host "$sym OK" }
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCPHttpTransport-${{ matrix.arch }}-2008r2
          path: native_components/MCPHttpTransport/build/Release/MCPHttpTransport.dll
